# Pilot scope, decided 2026-11-18 (docs/design.md, "Pilot scope").
# All scripts read taxa, region and period from here. Never hard-code them.

name: pilot-ept-trondheim
decided: 2026-11-18
decided_by: andersfi

taxa:
  label: EPT
  gbif_taxon_keys:
    - key: 1225
      name: Ephemeroptera
    - key: 787
      name: Plecoptera
    - key: 1003
      name: Trichoptera

region:
  label: Trondheim kommune
  # GADM level 2, boundaries from before 2020: Klæbu (NOR.15.8_1) is a separate unit
  # and outside the pilot. Open question in docs/design.md whether to include it.
  gadm_gid: NOR.15.24_1
  excluded_neighbours:
    - gadm_gid: NOR.15.8_1
      label: Klæbu

period:
  # No period restriction in the pilot.
  start: null
  end: null

survey_types:
  - water_quality_monitoring
  - restoration
  - restoration_followup
  - freshwater_biological_survey

languages: [nb, nn, sv, en]

# Read-only sources (docs/design.md, "Sources"). Only gbif is used so far.
sources:
  gbif:
    occurrence_search: true
  openalex: false
  crossref: false
  datacite: false
  nva: false
  brage_oai_pmh: false
  core: false
